name: Deploy to GitHub Pages

# Builds a static version of the platform and publishes it to GitHub Pages.
# The SPA's API layer is pluggable: for Pages we swap the HTTP adapter
# (api.js) for the client-side store adapter (api.local.js), so the whole app
# runs in the browser with no backend.

# Manual-only: this path requires Pages "Source" to be set to "GitHub Actions"
# in repo Settings first (the Actions GITHUB_TOKEN cannot create the Pages
# site on its own). If instead you use "Deploy from a branch" -> /docs (the
# committed static build), you don't need this workflow at all.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble static site
        run: |
          set -eux
          mkdir -p _site
          # all frontend assets (mobile H5 + desktop + PWA manifest/sw/icon)
          cp public/* _site/
          # shared business logic (pure JS, no Node APIs) runs in the browser
          cp src/data.js src/analytics.js src/store.js _site/
          # In the static build, `import './api.js'` must resolve to the
          # client-side store adapter instead of the HTTP one.
          cp _site/api.local.js _site/api.js

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
