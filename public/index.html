<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>古生代 · 化石拍卖与交易平台</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦖</text></svg>" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">🦴</span>
      <div>
        <h1>古生代 <span class="brand-sub">FOSSILIA</span></h1>
        <p class="tagline">化石拍卖 · 市场交易 · 价值趋势</p>
      </div>
    </div>
    <nav class="tabs" id="tabs">
      <button data-route="dashboard" class="active">概览</button>
      <button data-route="auctions">🔨 拍卖行</button>
      <button data-route="market">🛒 市场购买</button>
      <button data-route="sell">📤 我要出售</button>
      <button data-route="cases">📈 赚钱案例</button>
    </nav>
  </header>

  <main id="app">
    <!-- views injected here -->
  </main>

  <!-- modal host -->
  <div id="modal-root"></div>

  <div id="toast" class="toast" hidden></div>

  <footer class="footer">
    <p>原型演示 · 数据为模拟生成，价格趋势为统计模型预测，<b>不构成任何投资建议</b>。受文物保护法管制的标本（如恐龙蛋）仅作科普展示。</p>
  </footer>

  <script src="/charts.js"></script>
  <script src="/app.js"></script>
</body>
</html>
